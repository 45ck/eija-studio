<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayIDE</title>
<link rel="stylesheet" href="/assets/play.css">
<script src="/assets/vendor/dagre.min.js" defer></script>
<script src="/assets/vendor/maxgraph.min.js" defer></script>
<script src="/assets/play.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="logo" aria-hidden="true">▶</span><strong>PlayIDE</strong><span id="model-name" class="model-name"></span></div>
  <div class="actions">
    <span id="score" class="score" role="status" aria-live="polite" hidden></span>
    <button id="build" class="primary" type="button">Build &amp; run</button>
    <a class="quiet" href="/">Review workbench</a>
  </div>
</header>
<main class="layout">
  <nav class="outline" aria-labelledby="outline-title">
    <h2 id="outline-title">Model</h2>
    <h3>States</h3><ul id="outline-states"></ul>
    <h3>Transitions</h3><ul id="outline-transitions"></ul>
    <h3>Roles</h3><ul id="outline-roles"></ul>
  </nav>
  <section class="stage" aria-label="State machine diagram">
    <div class="stage-tools">
      <span class="kind">State machine</span>
      <button id="fit" type="button" class="quiet">Fit</button>
      <button id="zoom-in" type="button" class="quiet" aria-label="Zoom in">+</button>
      <button id="zoom-out" type="button" class="quiet" aria-label="Zoom out">−</button>
    </div>
    <div id="canvas" class="canvas" tabindex="0" aria-describedby="canvas-help"></div>
    <p id="canvas-help" class="hint">Drag states to arrange them. Select an element to inspect it. Arrangement is not saved yet.</p>
  </section>
  <aside class="side">
    <section class="inspector" aria-labelledby="inspector-title">
      <h2 id="inspector-title">Inspector</h2>
      <div id="inspector"><p class="muted">Select a state or transition.</p></div>
    </section>
    <section id="run" class="run" aria-labelledby="run-title" hidden>
      <div class="run-head"><h2 id="run-title">Running app</h2><a id="run-open" class="quiet" target="_blank" rel="noopener">Open in new tab</a></div>
      <iframe id="run-frame" title="The app built from this model"></iframe>
    </section>
  </aside>
</main>
</body>
</html>
