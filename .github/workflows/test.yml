name: local-poc-checks
# Hosted CI is currently unavailable for this repository: manual dispatch only (ADR-0017).
# Local equivalent: `nox -t full`.
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/verify_release.py
      - run: python scripts/http_smoke.py
# This configuration is supplied, not evidence of a completed remote CI run.
# Actions are pinned to the same reviewed commit digests as quality.yml.
