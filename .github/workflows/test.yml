name: local-poc-checks
# Manual dispatch only: release verification and the HTTP smoke test on Python 3.11 and 3.13.
# The fast tier runs on every pull request and push to main, and the full tier nightly, in quality.yml (ADR-0228).
on: [workflow_dispatch]
permissions:
  contents: read
concurrency:
  # A second dispatch on the same ref replaces the first instead of paying for both.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/verify_release.py
      - run: python scripts/http_smoke.py
# This configuration is supplied, not evidence of a completed remote CI run.
# Actions are pinned to the same reviewed commit digests as quality.yml.
