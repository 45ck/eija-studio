name: quality-gates
# Hosted CI is currently unavailable for this repository (ADR-0017, ADR-0035): manual dispatch only.
# The authoritative local equivalent is `nox -t full` (also the pre-push hook). Actions are pinned to commit SHAs
# (tags resolved 2026-09-29); re-review them before enabling push/pull_request triggers.
on: [workflow_dispatch]
permissions:
  contents: read
concurrency:
  # A second dispatch on the same ref replaces the first instead of paying for both.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    # The full tier takes ~13 min on 4 cores; a hung session must not bill up to the 6 h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      # The full tier needs these extras for imports, type checks and package discovery.
      - run: python -m pip install -e '.[dev,lint,testing,agents,providers,source-analysis,demos,xuml]'
      - run: python -m nox -t full
