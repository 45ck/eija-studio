name: quality-gates
# Hosted CI on GitHub's standard Linux runners (ADR-0228, superseding the manual-only part of ADR-0017).
# The repository is public, so standard runners cost nothing. Larger and macOS runners are billed even for public
# repositories: do not add them here.
# - Every pull request to main and every push to main runs the fast tier (~2 min on 4 cores).
# - The full tier runs nightly, and only when main changed in the last 26 hours. A red nightly opens or updates one issue.
# - Manual dispatch runs the full tier on any ref.
# Local `nox -t fast` / `nox -t full` stay the same commands, so a local run and a hosted run check the same gates.
# Actions are pinned to commit SHAs (tags resolved 2026-09-29).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 15 * * *'  # 15:17 UTC: overnight in eastern Australia, off the hour to avoid queue peaks
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer run on the same ref replaces the older one instead of paying for both.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  fast:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,lint,testing,agents,providers,source-analysis,demos,xuml]'
      - run: python -m nox -t fast

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The full tier takes ~13 min on 4 cores; a hung session must not bill up to the 6 h default.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Skip a nightly run when main has not changed
        id: changed
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ $((now - last)) -gt 93600 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main unchanged for over 26 hours: nightly full tier skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      # The full tier needs these extras for imports, type checks and package discovery.
      - if: steps.changed.outputs.run == 'true'
        run: python -m pip install -e '.[dev,lint,testing,agents,providers,source-analysis,demos,xuml]'
      - if: steps.changed.outputs.run == 'true'
        run: python -m nox -t full
      - name: Open or update the nightly failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly full tier failed on main"
          body="The nightly \`nox -t full\` run failed on $(git rev-parse --short HEAD): $RUN_URL"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
