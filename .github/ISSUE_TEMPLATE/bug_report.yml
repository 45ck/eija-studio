name: Bug report
description: Something behaves differently from what the docs or the evidence say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste provider keys, `receipt.key`, the private launch URL or real personal data. For a vulnerability, use the private security report instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Quote exact error text. Say which claim in the README or docs it contradicts, if any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest command sequence, starting from a clean checkout.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EIJA version or commit
      placeholder: "0.2.0, or the output of git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and Python
      placeholder: "Windows 11, Python 3.12.10"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `eija doctor`
      render: json
  - type: checkboxes
    id: honesty
    attributes:
      label: Checks
      options:
        - label: I did not run scripts/stamp_release.py or edit trusted_build.json.
          required: true
        - label: This is not a vulnerability (those go through SECURITY.md).
          required: true
