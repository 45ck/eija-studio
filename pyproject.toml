[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eija-studio"
version = "0.2.0"
description = "Local executable intent and journey assurance: bounded workflow POC"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = ["fastapi==0.128.2", "uvicorn==0.48.0", "pydantic==2.13.4", "httpx==0.28.1"]

[project.optional-dependencies]
# Each extra belongs to one capability lane; see docs/oss/REGISTER.md for why each tool was chosen.
dev = ["pytest==9.0.2", "nox>=2025.5.1", "tomlkit==0.15.1"]
lint = []
formal = []
testing = []
mutation = []
metrics = ["radon==6.0.1", "grimp==3.17", "coverage==7.16.2"]
hci = []
agents = []
docs = []
providers = []
visual = []
demos = []
ux = []
graph = []
dod = []

[project.scripts]
eija = "eija_studio.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]  # quality/ and verification/ are engineering tooling, never shipped

[tool.setuptools.package-data]
eija_studio = ["resources/**/*", "resources/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]  # "." so tests can import repo-root tooling packages (quality, demos)
testpaths = ["tests"]
addopts = "-ra"  # tests/conftest.py keeps pytest temp dirs inside the checkout (slow system temp)
