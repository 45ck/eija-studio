[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eija-studio"
version = "0.2.0"
description = "Local executable intent and journey assurance: bounded workflow POC"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = ["fastapi==0.128.2", "uvicorn==0.48.0", "pydantic==2.13.4", "httpx==0.28.1"]

[project.optional-dependencies]
# Each extra belongs to one capability lane; see docs/oss/REGISTER.md for why each tool was chosen.
dev = ["pytest==9.0.2", "nox>=2025.5.1"]
lint = []
formal = []
testing = []
mutation = []
metrics = []
hci = []
agents = []
# weave lane (ADR-0089 to 0112). Phase 1 needs only jsonschema (rule catalogue and SARIF structural checks); pySHACL is an
# optional cross-check installed by hand, not part of this extra (docs/weave/design/compiler-and-lint-rules.md section 2.4).
graph = ["jsonschema==4.26.0", "rfc8785==0.1.4", "networkx==3.5"]  # rfc8785: differential oracle for the canonical writer (tests/graph/test_metamodel_identity.py); networkx: SCC-partition and PageRank cross-check oracle (tests/graph/test_impact_math_oracles.py, never an artefact producer); both NOT_RUN when absent
# weave formal-verification aspect (ADR-0103): test-time tools only, never in a verdict path. Alloy is a pinned jar, not a wheel (graph/formal/TOOLS.lock).
graph-formal = ["hypothesis==6.168.3", "clingo==5.8.2"]  # both optional: absence gives NOT_RUN in tests/graph/formal, never a pass
docs = []

[project.scripts]
eija = "eija_studio.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]  # quality/ and verification/ are engineering tooling, never shipped

[tool.setuptools.package-data]
eija_studio = ["resources/**/*", "resources/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"  # tests/conftest.py keeps pytest temp dirs inside the checkout (slow system temp)
