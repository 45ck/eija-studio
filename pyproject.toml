[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: a default instance is immutable, so B008 does not apply.
extend-immutable-calls = ["demos.prgif.fit.Limits", "demos.prgif.terminal.Pacing"]

[tool.ruff.format]
# Applied only to files this lane owns (quality/gates, quality/sessions/quality.py); see docs/quality/gates.md.
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["eija_studio"]
plugins = ["pydantic.mypy"]
# Portable default for the whole package: the adapters use POSIX-only process-group calls that a Windows
# host would otherwise flag, and CI-less local runs must give the same answer on every developer PC.
platform = "linux"
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

# Strict where the kernel's invariants live. These are the flags `mypy --strict` enables.
[[tool.mypy.overrides]]
module = ["eija_studio.domain.*", "eija_studio.application.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
extra_checks = true

# Ratchet plan for the outer layers (adapters, interfaces, bootstrap): they already pass the default
# profile above. Next steps, one module at a time, each removing a line here: (1) bootstrap.py: annotate
# the provider factory table (currently inferred as `object`), (2) adapters.*: annotate dict[str, Any]
# returns and enable disallow_untyped_defs, (3) interfaces.*: same. `ignore_errors` is never used.
[[tool.mypy.overrides]]
module = ["eija_studio.bootstrap"]
disable_error_code = ["arg-type"]

# Feature extras are optional: type-checking must not fail on a machine where a lane's extra is not installed.
[[tool.mypy.overrides]]
module = ["mcp.*", "anyio.*", "psutil.*", "playwright.*", "axe_playwright_python.*", "z3.*", "hypothesis.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["src/eija_studio"]
branch = true
data_file = "reports/coverage/.coverage"

[tool.coverage.report]
# Ratchet: fail_under is the measured value floor (integer, rounded down). Raise it whenever coverage rises.
fail_under = 78  # measured 78.72 on 2026-09-28 (win32, py3.12); floor it, then only raise
show_missing = true
skip_empty = true
# Protocol/abstract stubs only: a `def ...: ...` line or a bare `...` line, never a real statement ending in `...`.
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", 'def .*:\s*\.\.\.$', '^\s*\.\.\.$']

[tool.coverage.html]
directory = "reports/coverage/html"

[tool.coverage.xml]
output = "reports/coverage/coverage.xml"

[tool.deptry]
# Sibling modules that graph/ scripts load through sys.path (no package), so deptry would take them for third-party names.
known_first_party = ["eija_studio", "quality", "verification", "eijaref", "human_views_reference", "storage_query_probe",
                     "build_schemas", "identity_checks", "typecheck", "run_alloy"]
# docs/weave/research holds one-off research probes with their own optional tools (tree-sitter, libcst, ...); they are
# recorded experiments, not part of the package or of any gate, so their imports are not dependency claims.
extend_exclude = ['\.tmp', 'reports', 'docs/weave/research']
# Only tool-only extras (dev, lint, docs) are dev groups. Feature extras (providers, agents, formal, hci, ...) are optional
# RUNTIME dependencies that lane code legitimately imports, so listing them here made every lane fail DEP004.
optional_dependencies_dev_groups = ["dev", "lint", "docs", "testing", "graph-formal"]  # testing and graph-formal (hypothesis) are imported by tests only

[tool.deptry.package_module_name_map]
# distribution name -> import name, where they differ
z3-solver = "z3"
axe-playwright-python = "axe_playwright_python"

[tool.deptry.per_rule_ignores]
# nox/pytest/radon/tomlkit are dev tools imported by noxfile.py, quality/ and tests/ (dev-only trees deptry
# cannot tell apart); tomlkit is the merge driver's parser (quality/tools/tomlmerge.py); yaml (PyYAML, `docs`
# extra) parses the issue forms in scripts/check_community_files.py, a dev-only gate.
DEP004 = ["nox", "pytest", "radon", "tomlkit", "yaml", "clingo"]  # clingo: the ASP oracle in graph/formal/eijaref/asp.py imports it lazily; absent means NOT_RUN
# scripts/browser_*smoke.py import Playwright lazily; it belongs to the hci extra, and the scripts report
# NOT_RUN when it is absent. Declaring it here would make a runtime dependency out of a QA tool.
# graph/bench scripts import their optional comparison engines (duckdb, rustworkx, ladybug, pyshacl, rdflib) inside the function that
# measures them; a missing engine is reported NOT_RUN. They are not runtime dependencies of anything.
DEP001 = ["playwright", "duckdb", "rustworkx", "ladybug", "pyshacl", "rdflib"]
# numpy and scipy are declared for networkx.pagerank (a test oracle) which imports them lazily; nothing of ours imports them.
DEP002 = ["numpy", "scipy"]

[tool.importlinter]
root_package = "eija_studio"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interfaces > bootstrap > adapters > application > domain"
type = "layers"
containers = ["eija_studio"]
layers = ["interfaces", "bootstrap", "adapters", "application", "domain"]
# A new subpackage added by another lane must be given a layer (or listed here with a reason), so it can never
# sit outside the layer order unnoticed. `__main__` is the `python -m eija_studio` entry point.
exhaustive = true
exhaustive_ignores = ["__main__", "resources"]

[[tool.importlinter.contracts]]
name = "Domain and application are free of web, HTTP, database and process vendors"
type = "forbidden"
source_modules = ["eija_studio.domain", "eija_studio.application"]
forbidden_modules = [
    "fastapi", "starlette", "httpx", "uvicorn", "sqlite3", "subprocess",
    "urllib", "http", "socket", "requests", "aiohttp", "sqlalchemy", "ftplib",
]

[[tool.importlinter.contracts]]
name = "Only bootstrap wires adapters"
type = "forbidden"
source_modules = ["eija_studio.domain", "eija_studio.application", "eija_studio.interfaces"]
forbidden_modules = ["eija_studio.adapters"]
allow_indirect_imports = true  # bootstrap legitimately reaches adapters; only DIRECT imports are wiring
